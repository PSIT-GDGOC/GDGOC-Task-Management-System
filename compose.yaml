# Local development only. Hosted environments supply their own connection URLs.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gdgoc_tasks
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - gdgoc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gdgoc_tasks']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gdgoc_postgres:
