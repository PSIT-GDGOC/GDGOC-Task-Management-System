<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem('taskhub-theme');
        const dark = saved !== 'light';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
    <title>GDGoC TaskHub - PSIT Kanpur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-gdgoc-gray-50 text-gdgoc-gray-900 font-sans antialiased min-h-screen">
    <div id="root">
      <div role="status" style="min-height:100vh;display:grid;place-content:center;text-align:center;font-family:system-ui,sans-serif">
        <h1 style="font-size:1.5rem">GDGoC TaskHub</h1>
        <p>Loading your workspace…</p>
      </div>
    </div>
    <noscript>Please enable JavaScript to use TaskHub.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
