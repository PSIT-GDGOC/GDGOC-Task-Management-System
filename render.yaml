services:
  # Backend Express Service on Render
  - type: web
    name: gdgoc-tracking-backend
    runtime: node
    branch: main
    plan: free
    region: oregon
    buildCommand: npm ci --workspace=backend --include-workspace-root --include=dev && npm run prisma:generate && npm run build:backend
    startCommand: npm run config:check --workspace=backend && npm run prisma:deploy && npm run prisma:seed && npm run start --workspace=backend
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 22.23.4
      - key: ENABLE_DEV_LOGIN
        value: 'true'
      - key: ALLOW_STAGING_DEV_LOGIN
        value: 'true'
      - key: ALLOW_SELF_REGISTRATION
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: none
      - key: GOOGLE_AUTH_ENABLED
        value: 'false'
      - key: WORKER_MODE
        value: embedded
      - key: REDIS_PREFIX
        value: gdgoc-production
      - key: REDIS_TRANSPORT
        value: render-internal
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SYSTEM_OWNER_EMAIL
        value: gdgoc.psit@gmail.com
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      # Configure GitHub and Google secrets later in the dashboard, then enable Google.
