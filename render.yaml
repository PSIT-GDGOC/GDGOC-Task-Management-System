services:
  # Backend Express Service on Render
  - type: web
    name: gdgoc-task-management-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run prisma:generate && npm run build:backend
    startCommand: npm run prisma:deploy && npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SYSTEM_OWNER_EMAIL
        value: gdgoc.psit@gmail.com
      - key: CLIENT_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
